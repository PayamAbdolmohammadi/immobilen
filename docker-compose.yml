services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: immobile-app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
    depends_on:
      - mysql
      - redis

  nginx:
    image: nginx:alpine
    container_name: immobile-nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app

  mysql:
    image: mysql:8.0
    container_name: immobile-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: immobile
      MYSQL_ROOT_PASSWORD: root
      MYSQL_PASSWORD: secret
      MYSQL_USER: immobile
    ports:
      - "3307:3306"
    volumes:
      - immobile_mysql:/var/lib/mysql

  redis:
    image: redis:alpine
    container_name: immobile-redis
    restart: unless-stopped

volumes:
  immobile_mysql:
