name: CI

on:
  push:
    branches: [ master ]

jobs:
  tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create env file
        run: cp .env.example .env

      - name: Add CI app key
        run: echo "APP_KEY=base64:U2VjcmV0S2V5Rm9yQ0lUZXN0c09ubHkxMjM0NTY3ODkwMTI=" >> .env

      - name: Build Docker containers
        run: docker compose build

      - name: Start Docker containers
        run: docker compose up -d

      - name: Wait for MySQL
        run: sleep 20

      - name: Install dependencies inside container
        run: docker compose exec -T app composer install --no-interaction --optimize-autoloader

      - name: Run migrations
        run: docker compose exec -T app php artisan migrate --force

      - name: Run tests
        run: docker compose exec -T app php artisan test
