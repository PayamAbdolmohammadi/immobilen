name: CI

on:
  push:
    branches: [ master ]

jobs:
  tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker containers
        run: docker compose build

      - name: Start Docker containers
        run: docker compose up -d

      - name: Wait for MySQL
        run: sleep 20

      - name: Install dependencies inside container
        run: docker compose exec -T app composer install --no-interaction --optimize-autoloader

      - name: Generate app key
        run: docker compose exec -T app php artisan key:generate

      - name: Run migrations
        run: docker compose exec -T app php artisan migrate --force

      - name: Run tests
        run: docker compose exec -T app php artisan test
